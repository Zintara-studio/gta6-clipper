[project]
name = "gta6-clipper"
version = "0.1.0"
description = "Automatic GTA 6 Shorts clipping engine: transcript -> best moments -> captioned vertical clips -> scheduled YouTube Studio uploads via ego-lite."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "yt-dlp>=2024.12.13",
  "faster-whisper>=1.1",
  "numpy>=1.26",
  "edge-tts>=6.1",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "streamlink>=8.6.3",
]

[project.scripts]
clip = "clipper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper"]
